name: Monthly Portfolio Audit

on:
  schedule:
    # 7th of every month at 9:00 AM UTC (avoids collision with site audit on the 1st)
    - cron: "0 9 7 * *"
  workflow_dispatch:
    inputs:
      portfolio_url:
        description: "Portfolio URL to audit"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Use sample data instead of live API calls"
        required: false
        type: boolean
        default: false

jobs:
  portfolio-audit:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run portfolio audit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          URL="${{ inputs.portfolio_url || secrets.PORTFOLIO_URL }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python orchestrator.py portfolio-audit --dry-run --create-issue
          else
            python orchestrator.py portfolio-audit --url "$URL" --create-issue
          fi

      - name: Commit outputs and audit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/ memory/last_audit_state.json
          git diff --cached --quiet || git commit -m "Add portfolio audit outputs [skip ci]"
          git pull --rebase
          git push

      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-audit-${{ github.run_id }}
          path: outputs/portfolio_audits/
          retention-days: 90
